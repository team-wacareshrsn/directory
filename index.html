  /* Rainier at dawn */
  --sky-top:#F7DDB2; --sky-mid:#F3E7D8; --sky-low:#CFE0EE;
  --sun:#F2B84B; --far:#A9C2D9; --peak:#7097BC; --snow:#F7FAFD; --ridge:#3C6890; --forest:#173A5C;
  --page:#EDF2F7; --card:#FFFFFF; --ink:#132A40; --soft:#4C6177; --rule:#D6E0EA;
  --navy:#173A5C; --county:#295A83; --gold:#F2B84B;
  --wacares:#1C6B78; --hrsn:#62498F; --lead:#8A5A10;
  --lang-bg:#FCEFD2; --lang-ink:#7A4D00;
}
@media (prefers-color-scheme: dark){
  :root{
    --sky-top:#0E2236; --sky-mid:#16304A; --sky-low:#22476A;
    --sun:#E9C46A; --far:#2C4D6E; --peak:#3B6189; --snow:#C9D8E6; --ridge:#1C3A58; --forest:#0D2134;
    --page:#0B1A28; --card:#122638; --ink:#E8EFF5; --soft:#A2B4C6; --rule:#213A52;
    --wacares:#3AA7B5; --hrsn:#9C85CF; --lead:#E2AE52;
    --lang-bg:#3A2E14; --lang-ink:#F6CF7D;
  }
  .mono,.faces span,.acts .call{color:#0B1A28!important}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:"Atkinson",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.5;background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--county);outline-offset:3px;border-radius:10px}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---------- HERO: Mount Rainier (county-approved photo) ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate;background:#5A9AD1 linear-gradient(90deg,#4A8FCE 0%,#5C9DD1 30%,#76AFD6 60%,#9CC7DD 100%)}
.photo{position:absolute;inset:0;z-index:-2}
.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 100%;animation:heroIn 1.6s cubic-bezier(.2,.7,.2,1) both}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(13,33,52,.38) 0%,rgba(13,33,52,.12) 38%,rgba(13,33,52,0) 60%),linear-gradient(90deg,rgba(13,33,52,.30) 0%,rgba(13,33,52,0) 62%)}
@media (prefers-color-scheme: dark){.hero::before{background:linear-gradient(180deg,rgba(8,22,36,.62) 0%,rgba(8,22,36,.36) 45%,rgba(8,22,36,.30) 100%),linear-gradient(90deg,rgba(8,22,36,.35) 0%,rgba(8,22,36,0) 62%)}}
@media (max-width:899px){
  .hero{background:#6AA6D4 linear-gradient(90deg,#5297CF 0%,#6AA8D4 50%,#8DBFDA 100%)}
  .photo{top:auto;height:340px}
  .photo img{object-position:52% 100%;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 34%);mask-image:linear-gradient(180deg,transparent 0,#000 34%)}
}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:calc(env(safe-area-inset-top) + 18px)}
.logo-card{display:flex;align-items:center;background:#fff;border-radius:14px;padding:8px 14px;box-shadow:0 4px 16px rgba(13,33,52,.22)}
.logo-card img{height:32px;width:auto;display:block}
.share{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;font-weight:700;font-size:15px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.share:hover{background:rgba(255,255,255,.28)}
.intro{position:relative;z-index:2;padding:44px 0 0;color:#fff;text-shadow:0 1px 14px rgba(10,28,46,.35)}
.intro h1{font-weight:800;font-size:clamp(40px,10.5vw,76px);line-height:.98;letter-spacing:-.035em;color:#fff;max-width:11ch}
.intro p{margin-top:14px;font-size:clamp(17px,2.4vw,20px);color:rgba(255,255,255,.94);max-width:34ch}
.crew{display:inline-flex;align-items:center;flex-wrap:wrap;gap:12px 18px;margin-top:26px;padding:10px 24px 10px 10px;border-radius:999px;background:rgba(13,33,52,.34);border:1px solid rgba(255,255,255,.24);box-shadow:0 12px 32px rgba(10,28,46,.20),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);text-shadow:none;animation:riseIn .9s .25s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-color-scheme: dark){.crew{background:rgba(6,18,30,.45);border-color:rgba(255,255,255,.16)}}
.tag{display:flex;flex-direction:column;line-height:1.22}
.tag .t1{font-size:17px;font-weight:700;color:#fff}
.tag .t2{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:800;color:#FFD47E;letter-spacing:.005em}
.tag .t2 svg{flex:none}
@media (max-width:479px){.crew{display:inline-flex;flex-direction:column;align-items:flex-start;border-radius:22px;padding:12px 18px 14px 12px;gap:10px}.faces span{width:36px;height:36px}}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.faces{display:flex;text-shadow:none}
.faces span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:var(--c);box-shadow:0 0 0 3px #fff;margin-left:-4px}
.faces span:first-child{margin-left:0}
.range{display:block;width:100%;height:clamp(200px,24vw,340px)}
@media (max-width:899px){.range{height:230px}}
@media (min-width:600px) and (max-width:899px){.photo{height:400px}.range{height:280px}}
@media (min-width:900px){.hero::before{background:linear-gradient(180deg,rgba(13,33,52,.36) 0%,rgba(13,33,52,.10) 45%,rgba(13,33,52,0) 70%),linear-gradient(90deg,rgba(13,33,52,.62) 0%,rgba(13,33,52,.50) 28%,rgba(13,33,52,.18) 50%,rgba(13,33,52,0) 66%)}}
@media (min-width:900px) and (prefers-color-scheme: dark){.hero::before{background:linear-gradient(180deg,rgba(8,22,36,.62) 0%,rgba(8,22,36,.36) 45%,rgba(8,22,36,.30) 100%),linear-gradient(90deg,rgba(8,22,36,.62) 0%,rgba(8,22,36,.45) 30%,rgba(8,22,36,0) 66%)}}
@media (max-width:899px) and (max-height:700px) and (orientation:portrait){.range{height:150px}.photo{height:290px}.intro{padding-top:32px}}
@media (max-height:520px) and (orientation:landscape){
  .hero{display:block;min-height:0}
  .photo{top:0;height:auto}
  .photo img{object-position:50% 62%;-webkit-mask-image:none;mask-image:none}
  .hero::before{background:linear-gradient(90deg,rgba(13,33,52,.62) 0%,rgba(13,33,52,.42) 40%,rgba(13,33,52,0) 72%)}
  .intro{padding-top:18px}
  .intro h1{font-size:clamp(32px,11vh,50px);max-width:none}
  .intro p{font-size:16px;max-width:46ch;margin-top:8px}
  .crew{margin-top:14px}
  .range{height:70px}
}
@media (min-width:900px){.hero{display:flex;flex-direction:column;min-height:min(44.3vw,1000px)}.hero>.wrap{width:100%}.range{height:auto;flex:1 0 140px}}
@keyframes heroIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}

/* ---------- STICKY SEARCH ---------- */
.finder{position:sticky;top:0;z-index:20;margin-top:-34px;padding:0 0 10px;transition:background .2s,box-shadow .2s}
.finder.stuck{background:var(--page);box-shadow:0 1px 0 var(--rule);padding-top:10px}
.search{display:flex;align-items:center;gap:12px;height:62px;padding:0 18px;background:var(--card);border-radius:18px;border:1px solid var(--rule);box-shadow:0 10px 30px rgba(23,58,92,.16)}
.search svg{flex:none;color:var(--county)}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font:inherit;font-size:18px;color:var(--ink)}
.search input::placeholder{color:var(--soft)}
.search input::-webkit-search-cancel-button{display:none}
.clear{display:none;width:32px;height:32px;border-radius:50%;background:var(--rule);color:var(--soft);font-size:20px;line-height:1;place-items:center}
.clear.show{display:grid}
.teams{display:flex;gap:4px;margin-top:10px;padding:4px;background:var(--card);border:1px solid var(--rule);border-radius:14px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.teams::-webkit-scrollbar{display:none}
.teams button{flex:1 0 auto;height:40px;padding:0 14px;border-radius:10px;font-size:15px;font-weight:700;color:var(--soft)}
.teams button[aria-pressed="true"]{background:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){.teams button[aria-pressed="true"]{background:#E8EFF5;color:#0B1A28}}

/* ---------- PEOPLE ---------- */
main{padding:10px 0 30px}
.group{margin-top:30px}
.group-head{display:flex;align-items:center;gap:12px;margin:0 2px 14px}
.group-head h2{font-size:24px;font-weight:800;letter-spacing:-.015em}
.group-head .n{font-size:15px;color:var(--soft)}
.group-head .badge{margin-left:auto;background:#fff;border-radius:10px;padding:6px 10px;display:flex;border:1px solid var(--rule)}
.group-head .badge img{height:24px;width:auto;display:block}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (max-width:380px){.search input{font-size:16px}.search{gap:10px;padding:0 14px}}
@media (max-width:420px){.teams{width:100%}.teams button{padding:0 10px;font-size:14.5px}}
@media (min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.grid{grid-template-columns:1fr 1fr 1fr}}

.person{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:20px;display:flex;flex-direction:column}
.id{display:flex;gap:16px;align-items:center}
.mono{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:800;font-size:23px;letter-spacing:.01em;position:relative}
.mono::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--c);opacity:.25}
.id h3{font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.id .role{font-size:16px;color:var(--soft);margin-top:2px}
.lang{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 10px;border-radius:999px;background:var(--lang-bg);color:var(--lang-ink);font-size:14px;font-weight:700}
.lines{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--rule);display:grid;gap:2px}
.lines button{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:16px;text-align:left;color:var(--ink);overflow-wrap:anywhere}
.lines button svg{flex:none;color:var(--soft)}
.lines button .cp{margin-left:auto;font-size:13px;font-weight:700;color:var(--soft);opacity:0;transition:opacity .15s}
.lines button:hover .cp,.lines button:focus-visible .cp{opacity:1}
.acts{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin-top:auto;padding-top:16px}
.acts a,.acts button{display:flex;align-items:center;justify-content:center;gap:7px;height:52px;border-radius:14px;font-size:16px;font-weight:700;border:1.5px solid var(--rule);color:var(--ink);transition:background .15s,transform .1s}
.acts a:hover,.acts button:hover{background:color-mix(in srgb,var(--c) 8%,transparent)}
.acts .call{background:var(--c);border-color:var(--c);color:#fff}
.acts .call:hover{background:color-mix(in srgb,var(--c) 86%,#000)}
.acts a:active,.acts button:active{transform:scale(.97)}

/* ---------- OFFICE PANEL ---------- */
.office{margin-top:34px;border-radius:24px;background:var(--navy);color:#fff;padding:26px 22px;position:relative;overflow:hidden}
@media (prefers-color-scheme: dark){.office{background:#132E48}}
.office .peak{position:absolute;right:-20px;bottom:-6px;width:260px;opacity:.12;pointer-events:none}
.office h2{font-size:26px;font-weight:800;letter-spacing:-.015em;line-height:1.15}
.office .addr{margin-top:6px;font-size:17px;color:#C6D6E6}
.office .tiles{display:grid;gap:10px;margin-top:20px;grid-template-columns:1fr;position:relative}
@media (min-width:700px){.office .tiles{grid-template-columns:1fr 1fr}}
.tile{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);text-align:left;width:100%;transition:background .15s}
.tile:hover{background:rgba(255,255,255,.13)}
.tile .ic{width:42px;height:42px;border-radius:12px;background:var(--gold);color:var(--navy);display:grid;place-items:center;flex:none}
.tile b{display:block;font-size:17px}
.tile small{display:block;font-size:14px;color:#B9CBDD}
.tile .go{margin-left:auto;font-size:14px;font-weight:700;color:var(--gold);white-space:nowrap}

.empty{display:none;text-align:center;padding:48px 16px;color:var(--soft)}
.empty.show{display:block}
.empty b{display:block;font-size:20px;color:var(--ink);margin-bottom:4px}

.hint{display:flex;align-items:center;gap:14px;margin-top:22px;padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid var(--rule)}
.hint .ic{width:44px;height:44px;border-radius:12px;background:var(--county);color:#fff;display:grid;place-items:center;flex:none}
.hint b{display:block;font-size:16px}
.hint small{font-size:15px;color:var(--soft)}
.hint .x{margin-left:auto;font-size:24px;color:var(--soft);padding:4px 8px}

footer{padding:34px 18px calc(env(safe-area-inset-bottom) + 34px);text-align:center;color:var(--soft);font-size:15px}
.flogos{display:flex;justify-content:center;gap:12px;margin-bottom:14px}
.flogos span{background:#fff;border-radius:12px;padding:8px 12px;display:flex;border:1px solid var(--rule)}
.flogos img{height:28px;width:auto;display:block}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,24px);opacity:0;background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;font-weight:700;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.finder,.acts,.hint,.share,.range,.photo{display:none!important}.hero{background:none}.hero::before{display:none}.intro,.intro h1,.intro p,.tag .t1,.tag .t2{color:#132A40;text-shadow:none}.crew{background:none;border-color:#D6E0EA;box-shadow:none}.person{break-inside:avoid}}
</style>

let filter = "all";

function roleLine(p) {
  if (p.supervises && p.supervises.length) return p.title + ", " + p.supervises.map(t => TEAMS[t].name).join(" & ");
  return p.title || TEAMS[p.teams[0]].name;
}

function matches(p, q) {
  if (filter !== "all" && !p.teams.includes(filter) && !(p.supervises || []).includes(filter)) return false;
  if (!q) return true;
  const langs = p.languages.map(l => /spanish/i.test(l) ? "spanish español espanol" : l).join(" ");
  const team = p.teams.concat(p.supervises || []).map(t => TEAMS[t].name).join(" ");
  const hay = [p.name, p.title, team, langs, p.email, digits(p.phone)].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function card(p) {
  const lang = p.languages.map(l => '<span class="lang">' + I.talk + (/spanish/i.test(l) ? "Habla español" : esc(l)) + '</span>').join(" ");
  return '<article class="person" style="--c:' + colorOf(p) + '">' +
    '<div class="id"><div class="mono" aria-hidden="true">' + esc(initials(p.name)) + '</div>' +
    '<div><h3>' + esc(p.name) + '</h3><div class="role">' + esc(roleLine(p)) + '</div>' + (lang ? '<div>' + lang + '</div>' : "") + '</div></div>' +
    '<div class="lines">' +
      '<button data-copy="' + esc(p.phone) + '" aria-label="Copy ' + esc(p.phone) + '">' + I.phone + '<span>' + esc(p.phone) + '</span><span class="cp">Copy</span></button>' +
      '<button data-copy="' + esc(mail(p.email)) + '" aria-label="Copy ' + esc(mail(p.email)) + '">' + I.mail + '<span>' + esc(mail(p.email)).replace("@", "<wbr>@") + '</span><span class="cp">Copy</span></button>' +
    '</div>' +
    '<div class="acts">' +
      '<a class="call" href="' + telHref(p.phone) + '" aria-label="Call ' + esc(p.name) + '">' + I.phone + 'Call</a>' +
      '<a href="mailto:' + esc(mail(p.email)) + '" aria-label="Email ' + esc(p.name) + '">' + I.mail + 'Email</a>' +
      '<button data-vcard="' + PEOPLE.indexOf(p) + '" aria-label="Save ' + esc(p.name) + ' to contacts">' + I.save + 'Save</button>' +
    '</div></article>';
}

function render() {
  const q = $("#q").value.trim();
  $("#clear").classList.toggle("show", !!q);
  const order = [["lead", "Supervisor"], ["wacares", TEAMS.wacares.name], ["hrsn", TEAMS.hrsn.name]];
  let html = "", shown = 0;
  order.forEach(([key, title]) => {
    const list = PEOPLE.filter(p => p.teams[0] === key && matches(p, q));
    if (!list.length) return;
    shown += list.length;
    html += '<section class="group"><div class="group-head"><h2>' + esc(title) + '</h2><span class="n">' + list.length + (list.length === 1 ? " person" : " people") + '</span>' +
      (key === "wacares" ? '<span class="badge"><img src="' + LOGO_WAC + '" alt="WA Cares Fund"></span>' : "") +
      '</div><div class="grid">' + list.map(card).join("") + '</div></section>';
  });
  $("#groups").innerHTML = html;
  const officeHay = "office main fax address directions adrc aging disability market street tacoma toll free wa cares 844 tty relay 711";
  const showOffice = filter === "all" && (!q || q.toLowerCase().split(/\s+/).every(w => officeHay.includes(w)));
  $("#office").hidden = !showOffice;
  $("#empty").classList.toggle("show", !shown && !showOffice);
}

function renderTeams() {
  const opts = [["all", "Everyone"], ["wacares", TEAMS.wacares.name], ["hrsn", TEAMS.hrsn.name]];
  $("#teams").innerHTML = opts.map(([k, l]) => '<button data-filter="' + k + '" aria-pressed="' + (filter === k) + '">' + esc(l) + '</button>').join("");
}

      HELP_LINES.map(h => tile("a", 'href="' + telHref(h.phone) + '"', I.phone, esc(h.label), esc(h.sub), "Call")).join("") +
    '</div>';

  $("#footer").innerHTML = '<div class="flogos"><span><img src="' + LOGO_PC + '" alt="Pierce County"></span><span><img src="' + LOGO_WAC + '" alt="WA Cares Fund"></span></div>' +
    esc(ORG) + '<br>Updated ' + esc(UPDATED);
}

let tt;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1800); }

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied " + text); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Copied " + text); } catch (e2) { toast(text); }
    ta.remove();
  }
}

function saveContact(p) {
  const { first, last } = splitName(p.name);
  const team = p.supervises ? p.supervises.map(t => TEAMS[t].name).join(" & ") : TEAMS[p.teams[0]].name;
  const v = ["BEGIN:VCARD", "VERSION:3.0", "N:" + last + ";" + first + ";;;", "FN:" + p.name, "ORG:" + ORG + ";" + team,
    p.title ? "TITLE:" + p.title : "", "TEL;TYPE=WORK,VOICE:" + p.phone, "EMAIL;TYPE=INTERNET,WORK:" + mail(p.email),
    "ADR;TYPE=WORK:;;" + OFFICE.street + ";" + OFFICE.city + ";" + OFFICE.state + ";" + OFFICE.zip + ";USA", "END:VCARD"].filter(Boolean).join("\r\n");
  const url = URL.createObjectURL(new Blob([v], { type: "text/vcard;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = p.name.replace(/[^\w]+/g, "_") + ".vcf";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Open the contact card to save " + first);
}

document.addEventListener("click", e => {
  const f = e.target.closest("[data-filter]"); if (f) { filter = f.dataset.filter; renderTeams(); render(); return; }
  const c = e.target.closest("[data-copy]"); if (c) { copyText(c.dataset.copy); return; }
  const v = e.target.closest("[data-vcard]"); if (v) { saveContact(PEOPLE[+v.dataset.vcard]); }
});
(function () { const mq = window.matchMedia("(max-width:359px)"); const set = () => { $("#q").placeholder = mq.matches ? "Search name, team, language" : "Search a name, team, or language"; }; set(); mq.addEventListener ? mq.addEventListener("change", set) : mq.addListener(set); })();
$("#q").addEventListener("input", render);
$("#clear").addEventListener("click", () => { $("#q").value = ""; render(); $("#q").focus(); });
$("#shareBtn").addEventListener("click", async () => {
  const d = { title: "ADR Team Directory", text: "Pierce County ADR case managers", url: location.href };
  if (navigator.share) { try { await navigator.share(d); } catch (e) {} } else copyText(location.href);
});
const fd = $("#finder");
window.addEventListener("scroll", () => fd.classList.toggle("stuck", fd.getBoundingClientRect().top <= 0 && scrollY > 60), { passive: true });

(function () {
  const ua = navigator.userAgent, standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
  let gone = false; try { gone = localStorage.getItem("adrHint") === "1"; } catch (e) {}
  if (/iphone|ipad|android/i.test(ua) && !standalone && !gone) {
    $("#hintText").textContent = /android/i.test(ua) ? "Tap the ⋮ menu, then “Add to Home screen.”" : "Tap Share, then “Add to Home Screen.”";
    $("#hint").hidden = false;
  }
  $("#hintClose").addEventListener("click", () => { $("#hint").hidden = true; try { localStorage.setItem("adrHint", "1"); } catch (e) {} });
})();

(function () {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 180; const x = c.getContext("2d");
    const g = x.createLinearGradient(0, 0, 0, 180); g.addColorStop(0, "#F7DDB2"); g.addColorStop(1, "#CFE0EE");
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = "#F2B84B"; x.beginPath(); x.arc(126, 52, 20, 0, 7); x.fill();
    x.fillStyle = "#7097BC"; x.beginPath(); x.moveTo(10, 150); x.lineTo(84, 54); x.lineTo(170, 150); x.fill();
    x.fillStyle = "#F7FAFD"; x.beginPath(); x.moveTo(70, 72); x.lineTo(84, 54); x.lineTo(98, 72); x.lineTo(90, 68); x.lineTo(84, 76); x.lineTo(77, 68); x.fill();
    x.fillStyle = "#173A5C"; x.fillRect(0, 150, 180, 30);
    const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = c.toDataURL("image/png"); document.head.appendChild(l);
  } catch (e) {}
})();

renderStatic(); renderTeams(); render();
</script>
</body>
</html>
